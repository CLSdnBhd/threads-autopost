name: Post to Threads

on:
  schedule:
    - cron: "0 5 * * *"    # 1:00 PM Malaysia time (UTC+8)
    - cron: "0 12 * * *"   # 8:00 PM Malaysia time
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post this approved post now (test). Leave empty to post whatever is due."
        required: false
      dry_run:
        description: "Dry run only (show, don't post)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Post
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_ID: ${{ inputs.post_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$POST_ID" ]; then ARGS+=(--id "$POST_ID"); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python3 poster/post.py "${ARGS[@]}"

      - name: Save result to queue
        if: always()
        run: |
          git config user.name "threads-autopost"
          git config user.email "actions@users.noreply.github.com"
          git add queue/queue.json
          git diff --cached --quiet || (git commit -m "Posted: update queue [skip ci]" && git pull --rebase && git push)
